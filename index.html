<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas Depopulacji Polski</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%23e94560'><animate attributeName='stop-color' values='%23e94560;%23a855f7;%23f59e0b;%23e94560' dur='4s' repeatCount='indefinite'/></stop><stop offset='100%25' stop-color='%23a855f7'><animate attributeName='stop-color' values='%23a855f7;%23e94560;%2310b981;%23a855f7' dur='4s' repeatCount='indefinite'/></stop></linearGradient></defs><rect width='100' height='100' rx='26' fill='%23090a10' stroke='url(%23g)' stroke-width='4'/><path d='M 18 62 L 34 38 L 48 52 L 64 24 L 82 42' fill='none' stroke='url(%23g)' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/><circle cx='64' cy='24' r='7' fill='%23e94560'><animate attributeName='r' values='5;9;5' dur='1.2s' repeatCount='indefinite'/></circle></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter',system-ui,sans-serif;background:#090a10;color:#f1f5f9}

/* Animated background */
.bg{position:fixed;inset:0;z-index:0;background:#090a10}
.bg::before{content:'';position:absolute;inset:-50%;background:conic-gradient(from 0deg at 50% 50%,#e94560 0%,#8b5cf6 25%,#06b6d4 50%,#10b981 75%,#e94560 100%);filter:blur(120px);opacity:0.15;animation:spin 20s linear infinite}
.bg::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 0%,#090a10 70%)}
@keyframes spin{to{transform:rotate(360deg)}}

/* Grid pattern */
.grid-pattern{position:fixed;inset:0;z-index:1;background-image:linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse at 50% 50%,black 30%,transparent 70%)}

/* Floating particles */
.particles{position:fixed;inset:0;z-index:1;overflow:hidden}
.particle{position:absolute;border-radius:50%;background:rgba(233,69,96,0.3);animation:float linear infinite}
@keyframes float{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10vh) scale(1);opacity:0}}

/* Content */
.wrap{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:20px;text-align:center}

/* Logo mark */
.logo-mark{width:80px;height:80px;margin-bottom:24px;position:relative}
.logo-mark svg{width:100%;height:100%;filter:drop-shadow(0 0 30px rgba(233,69,96,0.4))}

/* Title */
.title{font-size:clamp(2.5rem,8vw,5rem);font-weight:900;letter-spacing:-2px;line-height:1;margin-bottom:8px;background:linear-gradient(135deg,#f1f5f9 0%,#e94560 50%,#8b5cf6 100%);background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gradient 4s ease infinite}
@keyframes gradient{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

.subtitle{font-size:clamp(1rem,3vw,1.5rem);font-weight:300;color:#94a3b8;margin-bottom:48px;letter-spacing:1px}
.subtitle span{color:#e94560;font-weight:600}

/* Stats row */
.stats{display:flex;gap:clamp(20px,5vw,60px);margin-bottom:48px;flex-wrap:wrap;justify-content:center}
.stat{text-align:center}
.stat-num{font-size:clamp(2rem,5vw,3.5rem);font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.stat-num.red{color:#e94560}
.stat-num.amber{color:#f59e0b}
.stat-num.purple{color:#8b5cf6}
.stat-lbl{font-size:11px;color:#64748b;margin-top:6px;text-transform:uppercase;letter-spacing:1.5px}

/* CTA Button */
.cta{position:relative;display:inline-flex;align-items:center;gap:12px;padding:18px 48px;font-size:18px;font-weight:700;color:#fff;background:linear-gradient(135deg,#e94560,#c026d3);border:none;border-radius:60px;cursor:pointer;text-decoration:none;font-family:inherit;letter-spacing:0.5px;transition:all 0.3s ease;overflow:hidden}
.cta::before{content:'';position:absolute;inset:-2px;border-radius:62px;background:linear-gradient(135deg,#e94560,#8b5cf6,#06b6d4,#e94560);background-size:300% 300%;z-index:-1;animation:borderGlow 3s ease infinite;opacity:0;transition:opacity 0.3s}
.cta:hover::before{opacity:1}
.cta:hover{transform:translateY(-3px);box-shadow:0 20px 60px rgba(233,69,96,0.4)}
.cta:active{transform:translateY(0)}
@keyframes borderGlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

.cta-arrow{display:inline-block;transition:transform 0.3s}
.cta:hover .cta-arrow{transform:translateX(6px)}

/* Pulse ring */
.cta-wrap{position:relative}
.cta-wrap::before{content:'';position:absolute;inset:-8px;border-radius:68px;border:2px solid rgba(233,69,96,0.3);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:0.5}50%{transform:scale(1.05);opacity:0}}

/* Footer note */
.foot{position:absolute;bottom:24px;font-size:11px;color:#334155;letter-spacing:1px}

/* Scanline effect */
.scanline{position:fixed;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px)}

/* Responsive */
@media(max-width:640px){
  .stats{gap:20px}
  .cta{padding:14px 32px;font-size:15px}
}
</style>
</head>
<body>

<div class="bg"></div>
<div class="grid-pattern"></div>
<div class="particles" id="particles"></div>
<div class="scanline"></div>

<div class="wrap">
  <div class="logo-mark">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#e94560"><animate attributeName="stop-color" values="#e94560;#8b5cf6;#06b6d4;#e94560" dur="6s" repeatCount="indefinite"/></stop>
          <stop offset="100%" stop-color="#8b5cf6"><animate attributeName="stop-color" values="#8b5cf6;#e94560;#10b981;#8b5cf6" dur="6s" repeatCount="indefinite"/></stop>
        </linearGradient>
      </defs>
      <path d="M 15 70 L 30 40 L 45 55 L 65 20 L 85 38" fill="none" stroke="url(#lg)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="65" cy="20" r="8" fill="#e94560"><animate attributeName="r" values="6;10;6" dur="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="30" cy="40" r="4" fill="#8b5cf6" opacity="0.6"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="85" cy="38" r="4" fill="#06b6d4" opacity="0.6"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    </svg>
  </div>

  <div class="title">Atlas Depopulacji</div>
  <div class="subtitle">Polska <span>1995 — 2060</span></div>

  <div class="stats">
    <div class="stat">
      <div class="stat-num red" data-target="37.4" data-suffix="M">0</div>
      <div class="stat-lbl">Populacja 2025</div>
    </div>
    <div class="stat">
      <div class="stat-num amber" data-target="1.07" data-suffix="" data-decimals="2">0</div>
      <div class="stat-lbl">TFR (dzietność)</div>
    </div>
    <div class="stat">
      <div class="stat-num purple" data-target="80" data-suffix="%">0</div>
      <div class="stat-lbl">Gmin traci ludność</div>
    </div>
  </div>

  <div class="cta-wrap">
    <a href="dashboard.html" class="cta">
      Otwórz Dashboard
      <span class="cta-arrow">→</span>
    </a>
  </div>
</div>

<div class="foot">2479 gmin • 30 lat danych • GUS / BDL</div>

<script>
// Floating particles
(function(){
  const c=document.getElementById('particles');
  const colors=['rgba(233,69,96,0.2)','rgba(139,92,246,0.15)','rgba(6,182,212,0.12)','rgba(16,185,129,0.1)'];
  for(let i=0;i<30;i++){
    const p=document.createElement('div');
    p.className='particle';
    const size=Math.random()*4+2;
    p.style.cssText=`width:${size}px;height:${size}px;left:${Math.random()*100}%;background:${colors[i%4]};animation-duration:${Math.random()*15+10}s;animation-delay:${Math.random()*10}s`;
    c.appendChild(p);
  }
})();

// Counter animation
(function(){
  const nums=document.querySelectorAll('.stat-num');
  const duration=2000;
  const start=performance.now();
  function ease(t){return t<.5?4*t*t*t:(t-1)*(2*t-2)*(2*t-2)+1}
  function tick(now){
    const p=Math.min((now-start)/duration,1);
    const e=ease(p);
    nums.forEach(n=>{
      const target=parseFloat(n.dataset.target);
      const decimals=parseInt(n.dataset.decimals)||1;
      const suffix=n.dataset.suffix||'';
      n.textContent=e*target < 10 ? (e*target).toFixed(decimals)+suffix : Math.round(e*target)+suffix;
    });
    if(p<1)requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
